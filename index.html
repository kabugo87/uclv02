// ── MODIFIED SAVE DRAFT (adds error logging and ensures data extraction) ─────
async function saveDraft(){
  const weekOf=document.getElementById('week-of').value;
  if(!weekOf){setStatus('Please select the week first.','error');return;}
  setStatus('Saving draft...','');
  const btn=document.querySelector('button[onclick="saveDraft()"]');
  if(btn) { btn.disabled=true; btn.textContent='Saving...'; }

  let restTotal=0;
  document.querySelectorAll('#body-restaurant .total-val').forEach(c=>{
    restTotal+=parseFloat(c.textContent.replace('UGX','').replace(/,/g,''))||0;
  });
  let roomTotal=0;
  document.querySelectorAll('#body-room-sales .room-total').forEach(c=>{
    roomTotal+=parseFloat(c.textContent.replace('UGX','').replace(/,/g,''))||0;
  });

  try{
    // Extract all data using the updated extractTable (handles TomSelect)
    const barSalesData = extractTable('bar-sales');
    const barStockData = extractTable('bar-stock');
    const restaurantData = extractTable('restaurant');
    const roomSalesData = extractTable('room-sales');
    const storesData = extractTable('stores');
    const kitchenData = extractTable('kitchen');
    const roomsData = extractTable('rooms');
    const housekeepingData = extractTable('housekeeping');
    const securityData = extractTable('security');
    const maintenanceData = extractTable('maintenance');
    const staffCompData = extractTable('staff-comp');
    const trainingData = extractTable('training');
    const incidentsData = extractTable('incidents');

    // Check if draft already exists for this lodge and week
    const {data:existing}=await sb.from('weekly_reports')
      .select('id').eq('lodge',currentLodge).eq('week_of',weekOf).eq('is_draft',true).limit(1);

    const payload={
      week_of:weekOf, lodge:currentLodge, user_id:currentUser.id,
      user_email:currentUser.email, last_saved_at:new Date().toISOString(),
      archived:false, is_draft:true,
      bar_sales: barSalesData,
      bar_stock: barStockData,
      restaurant_sales: restaurantData,
      room_sales: roomSalesData,
      stores_stock: storesData,
      kitchen: kitchenData,
      room_inspections: roomsData,
      housekeeping_log: housekeepingData,
      security_log: securityData,
      maintenance_log: maintenanceData,
      staff_complimentary: staffCompData,
      training_log: trainingData,
      incidents: incidentsData,
      kitchen_sales_revenue: restTotal,
      room_revenue: roomTotal
    };

    let error;
    if(existing && existing.length>0){
      // Update existing draft
      ({error}=await sb.from('weekly_reports').update(payload).eq('id',existing[0].id));
    } else {
      // Create new draft
      payload.submitted_at=new Date().toISOString();
      ({error}=await sb.from('weekly_reports').insert([payload]));
    }
    if(error) throw error;
    setStatus('✓ Draft saved — '+fmtDT(new Date().toISOString()),'success');
    if(btn) { btn.disabled=false; btn.textContent='💾 Save Draft'; }
    loadDashboard(); // Refresh dashboard to show the draft
  }catch(err){
    console.error('Save draft error:', err);
    setStatus('Error saving draft: '+(err.message||''),'error');
    if(btn) { btn.disabled=false; btn.textContent='💾 Save Draft'; }
  }
}

  // Clear all existing rows first
  const allTabs = ['bar-sales','bar-stock','restaurant','room-sales','stores','kitchen','rooms','housekeeping','security','maintenance','staff-comp','training','incidents'];
  allTabs.forEach(tab => {
    const tbody = document.getElementById('body-'+tab);
    if(tbody) tbody.innerHTML = '';
  });

  // Helper to populate one table
  const fillTable = (tabName, rows) => {
    if(!rows||!rows.length) return;
    const tbody=document.getElementById('body-'+tabName);
    if(!tbody) return;
    rows.forEach((rowData, idx) => {
      addRow(tabName);
      const tr = tbody.lastElementChild;
      if(!tr) return;
      const inputs = tr.querySelectorAll('input');
      const selects = tr.querySelectorAll('select');
      function setSelectValue(sel, val) {
        if(!sel||val===undefined||val===null) return;
        if(sel.tomselect) {
          // Ensure option exists
          const optExists = sel.tomselect.getOption(val);
          if(!optExists && val) {
            sel.tomselect.addOption({value:val, text:val});
          }
          sel.tomselect.setValue(val);
        } else {
          for(let i=0;i<sel.options.length;i++) {
            if(sel.options[i].value == val) {
              sel.selectedIndex = i;
              break;
            }
          }
          if(sel.value !== val && val) {
            const opt = document.createElement('option');
            opt.value = val;
            opt.textContent = val;
            sel.appendChild(opt);
            sel.value = val;
          }
        }
      }

        if(inp && val!==undefined && val!==null) inp.value = val;
